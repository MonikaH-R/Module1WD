	<html>
<head>
  <title>Styled Table</title>
  <style>
    .container {
      border-collapse: collapse;
      width: 100%;
    }
    .container th, .container td {
      border: 1px solid black;
    }
  </style>
</head>
<body>
  <table class="container">
    <tr>
      <th>Student</th>
      <th>Math</th>
      <th>Science</th>
      <th>English</th>
    </tr>
    <tr>
      <td>John</td>
      <td>90</td>
      <td>85</td>
      <td>78</td>
    </tr>
    <tr>
      <td>Lisa</td>
      <td>78</td>
      <td>92</td>
      <td>88</td>
    </tr>
    <tr>
      <td>Mike</td>
      <td>86</td>
      <td>60</td>
      <td>92</td>
    </tr>
  </table>
</body>
</html>
