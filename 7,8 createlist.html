<html>  
<head>
    <title>Styled Lists</title>
    <style>
        h1 {
            color: blue;
        }
        h2 {
            color: green;
        }
        ul {
            color: red;
        }
        ol {
            color: purple;
        }
        ol ul {
            color: orange;
        }
        .favorite-places {
            color: teal;
        }
        img {
            display: block;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <img src="https://tse2.mm.bing.net/th?id=OIP.kDzBBwkA3PWuI78juK5pqwHaEU&pid=Api&P=0&h=180">
    <h1>My Favorite Things</h1>
    <h2>1. Fruits</h2>
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Cherry</li>
    </ul>
    <h2>2. Hobbies</h2>
    <ol>
        <li>Reading</li>
        <li>Traveling</li>
        <li>Cooking
            <ul>
                <li>Baking</li>
                <li>Grilling</li>
            </ul>
        </li>
    </ol>
    <h2 class="favorite-places">4. Favorite Places</h2>
    <ul>
        <li>Beach</li>
        <li>Mountains</li>
        <li>Forest</li>
    </ul>
</body>
</html>
