	<html>
<head>
    <title>Feedback Form</title>
    <style>
        .container {
            margin: auto;
            width: fit-content; 
            border: 1px solid;
            border-color: rgb(22, 24, 24);
        }
        button {
            color: rgb(13, 15, 15);
            background-color: rgb(87, 140, 219);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2><center>Contact Form</center></h2>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required> <br>
            <label for="Contact">Phone no:</label><br>    
            <input type="contact" id="Phone no" name="Phone no" required> <br><br>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
